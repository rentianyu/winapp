name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  PNPM_VERSION: '12'

jobs:
  # ------------------------------------------------------------------
  # L0 + L1：单测 / 跨平台类型检查 / 前端构建 / 前端 E2E（mock）
  # 并在 Linux 上交叉编译出 Windows exe（已验证 syso 资源在此链路上可靠）
  # ------------------------------------------------------------------
  build:
    name: L0+L1 单测与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go 单测（纯逻辑，-race）
        run: go test ./internal/... -race -count=1

      - name: Windows 目标类型检查（不需要 Windows 机器）
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: 确认业务层无平台依赖（Linux 下也能 vet）
        run: go vet ./internal/...

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 前端依赖与构建
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: 安装 Playwright（仅 Chromium）
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: 前端 E2E（mock bridge）
        run: |
          cd frontend
          pnpm run e2e:mock

      - name: 安装 go-winres（Linux 上生成 Windows 资源）
        run: go install github.com/tc-hib/go-winres@latest

      - name: 安装 PE 校验依赖
        run: python3 -m pip install --quiet pefile

      - name: 交叉编译 Windows exe
        run: bash scripts/build.sh --skip-frontend --version="0.1.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-e2e-screenshots
          path: frontend/e2e-report/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # L2：真机 WebView2 E2E（只跑测试，不做构建 —— 窗口期更短）
  # ------------------------------------------------------------------
  e2e-windows:
    name: L2 真机 E2E
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 取回 Linux 上构建的 exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist

      - name: 前端测试依赖
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile

      - name: 启动应用并跑真机 E2E
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\json-toolbox-windows-amd64.exe"
          $env:WINAPP_DEBUG_PORT = "9222"
          Start-Process -FilePath $exe
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:9222/json/version" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ready = $true; Write-Host "CDP 就绪（第 $i 秒）"; break }
            } catch { }
          }
          if (-not $ready) { throw "WebView2 CDP 端口在 40 秒内未就绪" }
          Set-Location frontend
          pnpm run e2e:win

      - name: 关闭应用
        if: always()
        shell: pwsh
        run: Get-Process -Name json-toolbox -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-report
          path: frontend/e2e-report/
          if-no-files-found: warn
