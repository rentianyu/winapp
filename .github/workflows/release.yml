name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，例如 0.1.0）'
        required: true
        default: '0.1.0'

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'
  PNPM_VERSION: '12'

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本: $V"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装 go-winres
        run: go install github.com/tc-hib/go-winres@latest

      - name: 前端依赖与构建
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: 编译 exe（含图标/清单/版本信息）
        shell: bash
        run: bash scripts/build.sh --skip-frontend --version="${{ steps.ver.outputs.version }}"

      - name: 生成绿色版 zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "dist/json-toolbox-$v-windows-amd64.zip"
          Compress-Archive -Path "dist/json-toolbox-windows-amd64.exe","README.md" -DestinationPath $out -Force
          Write-Host "生成 $out"

      - name: 生成安装包（Inno Setup）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          & $iscc "/DMyAppVersion=$v" "build\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 编译失败" }

      - name: 计算校验和
        shell: bash
        run: |
          cd dist
          sha256sum *.exe *.zip *.exe > /dev/null 2>&1 || true
          sha256sum *.exe *.zip > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: 产物体检（版本号必须对得上）
        shell: bash
        run: |
          python3 -m pip install --quiet pefile
          python3 scripts/exe_peek.py dist/json-toolbox-windows-amd64.exe \
            --expect-version "${{ steps.ver.outputs.version }}" --expect-arch amd64

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/json-toolbox-windows-amd64.exe
            dist/json-toolbox-*.zip
            dist/json-toolbox-*-setup.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 可选：同步到 R2 做国内直连分发（需要仓库 secrets）
      # - name: 上传到 R2
      #   shell: bash
      #   env:
      #     R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      #     R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      #     R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      #   run: |
      #     V="${{ steps.ver.outputs.version }}"
      #     curl -sSL "https://f.xbta.cc/ai/win/rclone-linux-amd64.zip" -o /tmp/rclone.zip || true
      #     # 用 aws cli 上传 dist/* 到 f.xbta.cc/winapp/<version>/
